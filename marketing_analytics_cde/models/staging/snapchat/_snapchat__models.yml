models:
  - name: stg_snapchat__campaigns
    description: "Staged Snapchat campaigns. One row per campaign."
    columns:
      - name: campaign_id
        description: "Unique identifier for each campaign"
        data_tests:
          - unique
          - not_null

      - name: account_id
        description: "The id of the account the campaign belongs to"
        data_tests:
          - not_null

      - name: campaign_name
        description: "The name of the campaign"
        data_tests:
          - not_null

  - name: stg_snapchat__adgroups
    description: "Staged Snapchat ad groups. One row per ad group, keeping only the latest version from the history table."
    columns:
      - name: ad_group_id
        description: "Unique identifier for each ad group"
        data_tests:
          - unique
          - not_null

      - name: campaign_id
        description: "The id of the campaign the ad group belongs to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_snapchat__campaigns')
                field: campaign_id

      - name: ad_group_name
        description: "The name of the ad group"
        data_tests:
          - not_null

      - name: ad_group_updated_at
        description: "The timestamp when the latest version of the ad group was updated"
        data_tests:
          - not_null

  - name: stg_snapchat__ads
    description: "Staged Snapchat ads. One row per ad, keeping only the latest version from the history table."
    columns:
      - name: ad_id
        description: "Unique identifier for each ad"
        data_tests:
          - unique
          - not_null

      - name: ad_group_id
        description: "The id of the ad group the ad belongs to"
        data_tests:
          - not_null
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_snapchat__adgroups')
                field: ad_group_id

      - name: ad_name
        description: "The name of the ad"
        data_tests:
          - not_null

      - name: ad_updated_at
        description: "The timestamp when the latest version of the ad was updated"
        data_tests:
          - not_null

  - name: stg_snapchat__ads_stats
    description: "Staged Snapchat daily ad stats. One row per ad, country and day."
    columns:
      - name: ad_stat_id
        description: "Surrogate key built from ad_id, ad_country and ad_date"
        data_tests:
          - unique
          - not_null

      - name: ad_id
        description: "The id of the ad the stats belong to"
        data_tests:
          - not_null
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_snapchat__ads')
                field: ad_id

      - name: ad_country
        description: "The country the stats were recorded for, uppercased ISO code"
        data_tests:
          - not_null

      - name: ad_currency_code
        description: "The currency code of the spend amount, uppercased"
        data_tests:
          - not_null

      - name: ad_date
        description: "The date the ad stats were captured"
        data_tests:
          - not_null

      - name: ad_spend
        description: "The amount spent on the ad, in ad_currency_code"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: ad_impressions
        description: "The number of impressions generated by the ad"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: ad_clicks
        description: "The number of clicks received by the ad. Can be null"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: data_source
        description: "The system the row was sourced from"
        data_tests:
          - not_null

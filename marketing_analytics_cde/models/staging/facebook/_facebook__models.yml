models:
  - name: stg_facebook__campaigns
    description: "Staged Facebook campaigns. One row per campaign."
    columns:
      - name: campaign_id
        description: "Unique identifier for each campaign"
        data_tests:
          - unique
          - not_null

      - name: campaign_name
        description: "The name of the campaign"
        data_tests:
          - not_null

      - name: campaign_updated_at
        description: "The timestamp when the campaign was updated"
        data_tests:
          - not_null

  - name: stg_facebook__adgroups
    description: "Staged Facebook ad groups. One row per ad group."
    columns:
      - name: ad_group_id
        description: "Unique identifier for each ad group"
        data_tests:
          - unique
          - not_null

      - name: ad_group_name
        description: "The name of the ad group"
        data_tests:
          - not_null

      - name: ad_group_updated_at
        description: "The timestamp when the ad group was updated"
        data_tests:
          - not_null

  - name: stg_facebook__accounts
    description: "Staged Facebook ad accounts. One row per account."
    columns:
      - name: account_id
        description: "Unique identifier for each account"
        data_tests:
          - unique
          - not_null

      - name: account_name
        description: "The name of the account"
        data_tests:
          - not_null

      - name: ad_currency_code
        description: "The currency code of the account, uppercased"
        data_tests:
          - not_null

      - name: account_created_at
        description: "The timestamp when the ad account was created"
        data_tests:
          - not_null

      - name: account_updated_at
        description: "The timestamp when the ad account was updated"
        data_tests:
          - not_null

  - name: stg_facebook__ads
    description: "Staged Facebook ads. One row per ad."
    columns:
      - name: ad_id
        description: "Unique identifier for each ad"
        data_tests:
          - unique
          - not_null

      - name: ad_group_id
        description: "The id of the ad group the ad belongs to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__adgroups')
                field: ad_group_id

      - name: campaign_id
        description: "The id of the campaign the ad belongs to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__campaigns')
                field: campaign_id

      - name: account_id
        description: "The id of the account the ad belongs to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__accounts')
                field: account_id

      - name: ad_name
        description: "The name of the ad"
        data_tests:
          - not_null

      - name: ad_status
        description: "The status of the ad, uppercased"
        data_tests:
          - not_null

      - name: ad_updated_at
        description: "The timestamp when the ad was updated"
        data_tests:
          - not_null

  - name: stg_facebook__ads_stats
    description: "Staged Facebook daily ad stats. One row per ad per day."
    columns:
      - name: ad_stat_id
        description: "Surrogate key built from ad_id and ad_date"
        data_tests:
          - unique
          - not_null

      - name: ad_id
        description: "The id of the ad the stats belong to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__ads')
                field: ad_id

      - name: account_id
        description: "The id of the account the stats belong to"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__accounts')
                field: account_id

      - name: ad_date
        description: "The date the ad stats were captured"
        data_tests:
          - not_null

      - name: ad_spend
        description: "The amount spent on the ad, in the account's currency"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: ad_impressions
        description: "The number of impressions generated by the ad"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: ad_clicks
        description: "The number of clicks received by the ad"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
